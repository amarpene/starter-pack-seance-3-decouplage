openapi: 3.1.0
info:
  title: LogiFlow GPS Ingestion API
  version: 1.0.0
  description: API d'ingestion des positions GPS des chauffeurs.
paths:
  /api/positions:
    post:
      operationId: submitPosition
      summary: Ingest a GPS position
      description: Accepte une position GPS pour traitement asynchrone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionRequest'
      responses:
        '202':
          description: Position accepted for asynchronous processing.
          headers:
            Server-Timing:
              description: Durée de mise en file mesurée par le service d'ingestion.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - accepted
                  - pingId
                properties:
                  accepted:
                    type: boolean
                    const: true
                  pingId:
                    type: string
        '400':
          description: Invalid request body or GPS position.
        '503':
          description: The Redis-backed ingestion queue is unavailable.
components:
  schemas:
    PositionRequest:
      type: object
      additionalProperties: false
      required:
        - driverId
        - latitude
        - longitude
        - timestamp
      properties:
        driverId:
          type: string
          minLength: 1
          description: Identifiant du chauffeur.
        pingId:
          type: string
          minLength: 1
          maxLength: 128
          description: Identifiant optionnel assurant l'idempotence d'un ping.
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        timestamp:
          type: integer
          description: Horodatage de la position fourni par le client, en millisecondes Unix.
